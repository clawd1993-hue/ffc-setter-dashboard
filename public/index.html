<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFC Setter — Inbox</title>
<style>
  :root{--blue:#0084FF;--blue-soft:#E7F3FF;--bg:#F5F6F8;--line:#E4E6EB;--text:#1C1E21;--muted:#65676B;--green:#31A24C;--amber:#F5A623;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{height:100vh;display:flex;background:var(--bg);color:var(--text);font-size:14px;}
  .list{width:320px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .list-head{padding:16px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:space-between;}
  .badge{background:var(--blue);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
  .search{padding:10px 16px;border-bottom:1px solid var(--line);}
  .search input{width:100%;padding:8px 12px;border:none;background:var(--bg);border-radius:18px;font-size:13px;outline:none;}
  .convos{overflow-y:auto;flex:1;}
  .convo{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);}
  .convo:hover{background:#fafbfc;}
  .convo.active{background:var(--blue-soft);}
  .avatar{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;}
  .meta{flex:1;min-width:0;}
  .meta .top{display:flex;justify-content:space-between;align-items:center;}
  .meta .name{font-weight:600;}
  .meta .time{color:var(--muted);font-size:11px;}
  .meta .preview{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-top:4px;font-weight:600;}
  .tag.auto{background:#E6F4EA;color:var(--green);}
  .tag.hot{background:#FDECEA;color:#D93025;}
  .tag.review{background:#FEF3D9;color:#B8860B;}
  .tag.replied{background:#E7F3FF;color:#0084FF;}
  .thread{flex:1;display:flex;flex-direction:column;background:#fff;}
  .thread-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:66px;}
  .thread-head .name{font-weight:700;font-size:16px;}
  .thread-head .sub{color:var(--muted);font-size:12px;}
  .mode-toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .switch{position:relative;width:150px;height:30px;background:var(--bg);border:1px solid var(--line);border-radius:16px;cursor:pointer;font-size:12px;font-weight:600;display:flex;}
  .switch div{flex:1;display:flex;align-items:center;justify-content:center;border-radius:14px;margin:3px;color:var(--muted);transition:.15s;}
  .switch div.on{background:var(--blue);color:#fff;}
  .switch.disabled{cursor:not-allowed;opacity:.55;filter:grayscale(1);pointer-events:none;}
  .msgs{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:10px;background:#fff;}
  .bubble{max-width:62%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .in{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px;}
  .out{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .stamp{align-self:center;color:var(--muted);font-size:11px;margin:4px 0;}
  .compose{border-top:1px solid var(--line);padding:14px 20px;background:#fff;position:relative;}
  .auto-btn{background:#fff;border:1px solid var(--line);color:var(--blue);font-size:17px;padding:8px 13px;line-height:1;}
  .auto-btn:hover{background:var(--blue-soft);}
  .flowmenu{display:none;position:absolute;bottom:62px;left:20px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:250px;max-height:300px;overflow-y:auto;z-index:30;padding:6px;}
  .flowhead{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;padding:8px 10px 6px;}
  .flowitem{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;}
  .flowitem:hover{background:var(--blue-soft);}
  .flowitem.muted{color:var(--muted);cursor:default;}
  .flowitem.add{color:var(--blue);font-weight:600;border-top:1px solid var(--line);margin-top:4px;}
  .flowitem .del{float:right;color:var(--muted);font-weight:700;padding:0 4px;}
  .flowitem .del:hover{color:#D93025;}
  .canned-btn{background:#fff;border:1px solid var(--line);color:var(--blue);font-size:15px;padding:8px 12px;line-height:1;}
  .canned-btn:hover{background:var(--blue-soft);}
  .inputwrap{position:relative;flex:1;display:flex;}
  .inputwrap textarea{flex:1;padding:10px 42px 10px 14px;border:1px solid var(--line);border-radius:20px;outline:none;font-size:14px;font-family:inherit;resize:none;max-height:220px;line-height:1.4;overflow-y:auto;}
  .emoji-btn{position:absolute;right:10px;bottom:9px;background:none;border:none;cursor:pointer;color:var(--muted);line-height:0;padding:2px;display:flex;}
  .emoji-btn:hover{color:var(--text);}
  .emojimenu{display:none;position:absolute;bottom:62px;right:20px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;z-index:30;width:264px;max-height:210px;overflow-y:auto;}
  .emojimenu span{display:inline-block;font-size:21px;padding:4px 6px;cursor:pointer;border-radius:6px;}
  .emojimenu span:hover{background:var(--blue-soft);}
  .ai-suggest{background:var(--blue-soft);border:1px solid #CCE4FF;border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .ai-suggest .label{font-size:11px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .ai-suggest .txt{font-size:14px;line-height:1.45;}
  .ai-actions{display:flex;gap:8px;margin-top:10px;}
  .btn{border:none;border-radius:18px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn.send{background:var(--blue);color:#fff;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text);}
  .btn.skip{background:#fff;border:1px solid var(--line);color:var(--muted);margin-left:auto;}
  .inputrow{display:flex;gap:10px;align-items:center;}
  .inputrow input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:20px;outline:none;font-size:14px;}
  .panel{width:260px;background:#fff;border-left:1px solid var(--line);padding:20px;overflow-y:auto;}
  .panel h4{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin:18px 0 8px;}
  .panel .lead-name{font-weight:700;font-size:16px;}
  .panel .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);}
  .panel .row .k{color:var(--muted);}
  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-weight:600;margin:2px 4px 2px 0;}
  .empty{margin:auto;color:var(--muted);}
  .bm{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-decoration:none;color:var(--text);font-size:13px;font-weight:600;transition:.12s;}
  .bm:hover{background:var(--blue-soft);border-color:#CCE4FF;}
  .bm .ico{color:var(--blue);flex:0 0 auto;}
  .bm img.ico{width:18px;height:18px;border-radius:4px;object-fit:contain;display:block;}
  .bm .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bm .del{color:var(--muted);font-weight:700;padding:0 2px;}
  .bm .del:hover{color:#D93025;}
  .bm-add{width:100%;border:1px dashed var(--line);background:#fff;color:var(--blue);border-radius:10px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;}
  .bm-add:hover{background:var(--blue-soft);}
  /* --- on-theme modal --- */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(28,30,33,.45);z-index:100;align-items:center;justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:420px;max-width:calc(100vw - 40px);overflow:hidden;animation:modalPop .14s ease-out;}
  @keyframes modalPop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-head{padding:18px 22px 4px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
  .modal-body{padding:12px 22px 4px;}
  .modal-body label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin:10px 0 6px;font-weight:600;}
  .modal-body textarea,.modal-body input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--bg);transition:.12s;}
  .modal-body textarea{resize:none;min-height:88px;line-height:1.4;}
  .modal-body textarea:focus,.modal-body input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-soft);}
  .modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:10px;}
  .modal-foot .btn{padding:9px 18px;border-radius:20px;}
</style>
</head>
<body>
  <div class="list">
    <div class="list-head">Inbox <span class="badge" id="count">—</span></div>
    <div class="search"><input autocomplete="off" placeholder="Search conversations..." oninput="filter(this.value)"></div>
    <div class="convos" id="convos"></div>
  </div>

  <div class="thread" id="thread"><div class="empty">Select a conversation</div></div>

  <div class="panel" id="panel"></div>

  <div class="modal-overlay" id="savedModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">⭐ New saved message</div>
      <div class="modal-body">
        <label for="sm-text">Message</label>
        <textarea id="sm-text" placeholder="Type the reply you want to save..."></textarea>
        <label for="sm-title">Short label <span style="text-transform:none;color:var(--muted);font-weight:400">(optional)</span></label>
        <input id="sm-title" type="text" placeholder="e.g. Booking link ask" autocomplete="off">
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="closeSavedModal()">Cancel</button>
        <button class="btn send" onclick="submitSavedModal()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="bmModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">🔖 New bookmark</div>
      <div class="modal-body">
        <label for="bm-label">Name</label>
        <input id="bm-label" type="text" placeholder="e.g. Booking Link" autocomplete="off">
        <label for="bm-url">Link URL</label>
        <input id="bm-url" type="text" placeholder="https://..." autocomplete="off">
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="closeBmModal()">Cancel</button>
        <button class="btn send" onclick="submitBmModal()">Save</button>
      </div>
    </div>
  </div>

<script>
let LIST=[], CUR=null, FILTER='';
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};

async function loadList(){
  LIST=await (await fetch('/api/conversations')).json();
  LIST.sort((a,b)=>b.updated-a.updated);
  document.getElementById('count').textContent=LIST.length;
  const q=FILTER.toLowerCase();
  document.getElementById('convos').innerHTML=LIST.filter(c=>!q||(c.name+c.preview).toLowerCase().includes(q)).map(c=>`
    <div class="convo ${c.id===CUR?'active':''}" onclick="open_('${c.id}')">
      <div class="avatar" style="background:${c.avatarColor}">${esc((c.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2))}</div>
      <div class="meta">
        <div class="top"><span class="name">${esc(c.name)}</span><span class="time">${ago(c.updated)}</span></div>
        <div class="preview">${esc(c.preview)}</div>
        <span class="tag ${c.tag}">● ${c.tag==='auto'?'Auto':c.tag==='hot'?'Hot — take over':c.tag==='replied'?'Replied':'Needs review'}</span>
      </div>
    </div>`).join('')||'<div class="empty" style="padding:30px">No conversations</div>';
}
function filter(v){FILTER=v;loadList();}

async function open_(id,keepDraft){
  CUR=id;
  // preserve whatever the human is typing across the 5s auto-refresh
  const prevEl=document.getElementById('reply');
  const draft=keepDraft&&prevEl?prevEl.value:'';
  const hadFocus=keepDraft&&prevEl&&document.activeElement===prevEl;
  const caret=prevEl?prevEl.selectionStart:0;
  const c=await (await fetch('/api/conversation/'+id)).json();
  // auto-refresh: if no NEW message arrived, don't rebuild the pane at all
  // (prevents scroll jumps, closing the flow menu, and wiping a draft)
  if(keepDraft&&CUR===id&&window.__msgCount===(c.messages||[]).length){loadList();return;}
  const sug=c.suggestion;
  document.getElementById('thread').innerHTML=`
    <div class="thread-head">
      <div class="avatar" style="background:${c.avatarColor};width:38px;height:38px;flex:0 0 38px;font-size:14px;">${esc((c.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2))}</div>
      <div><div class="name">${esc(c.name)}</div><div class="sub">${c.email?'✉️ '+esc(c.email):esc(c.channel)}</div></div>
      <div class="mode-toggle" title="Goal: full auto mode (locked for now)">Mode:
        <div class="switch disabled">
          <div class="${c.mode==='approve'?'on':''}">Approve</div>
          <div class="${c.mode==='auto'?'on':''}">Auto</div>
        </div>
      </div>
    </div>
    <div class="msgs" id="msgs">${c.messages.map(m=>`<div class="bubble ${m.dir==='in'?'in':'out'}">${esc(m.text)}</div>`).join('')}</div>
    <div class="compose">
      ${sug?`<div class="ai-suggest">
        <div class="label">🤖 AI suggested reply · confidence ${Math.round((sug.confidence||0)*100)}%</div>
        <div class="txt" id="sugtxt">${esc(sug.text)}</div>
        <div class="ai-actions">
          <button class="btn send" onclick="send('${c.id}',document.getElementById('sugtxt').textContent)">Send ✓</button>
          <button class="btn ghost" onclick="document.getElementById('reply').value=document.getElementById('sugtxt').textContent;document.getElementById('reply').focus()">Edit</button>
        </div></div>`:''}
      <div id="flowmenu" class="flowmenu"></div>
      <div id="cannedmenu" class="flowmenu"></div>
      <div id="emojimenu" class="emojimenu"></div>
      <div class="inputrow">
        <button class="btn auto-btn" title="Fire an automation" onclick="openFlows('${c.id}')">⚡</button>
        <button class="btn canned-btn" title="Saved messages" onclick="openCanned('${c.id}')">⭐</button>
        <div class="inputwrap">
          <textarea id="reply" rows="1" autocomplete="off" placeholder="Type your own reply..." oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,220)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send('${c.id}',this.value);}"></textarea>
          <button class="emoji-btn" title="Emoji" onclick="toggleEmoji()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.4 2 4 2 4-2 4-2"/><line x1="9" y1="9.2" x2="9.01" y2="9.2"/><line x1="15" y1="9.2" x2="15.01" y2="9.2"/></svg></button>
        </div>
        <button class="btn send" onclick="send('${c.id}',document.getElementById('reply').value)">Send</button>
      </div>
    </div>`;
  const m=document.getElementById('msgs'); if(m)m.scrollTop=m.scrollHeight;
  window.__msgCount=(c.messages||[]).length;
  // restore the draft the human was typing before the refresh
  const r=document.getElementById('reply');
  if(r&&draft){r.value=draft; if(hadFocus){r.focus(); try{r.setSelectionRange(caret,caret);}catch(e){}}}
  loadList();
}
const EMOJIS=['😀','😁','😂','🤣','😊','😍','😎','😅','😉','🙂','🤔','😢','😭','😤','🥳','😘','👍','👎','🙏','🔥','💪','🎯','✅','💯','💰','📅','🚀','👋','🙌','❤️','🤝','👀','✨','😬','🤷','💬'];
function toggleEmoji(){
  const fm=document.getElementById('flowmenu'); if(fm)fm.style.display='none';
  const cm=document.getElementById('cannedmenu'); if(cm)cm.style.display='none';
  const menu=document.getElementById('emojimenu'); if(!menu)return;
  if(menu.style.display==='block'){ menu.style.display='none'; return; }
  menu.innerHTML=EMOJIS.map(e=>`<span onclick="insertEmoji('${e}')">${e}</span>`).join('');
  menu.style.display='block';
}
function insertEmoji(em){
  const r=document.getElementById('reply'); if(!r)return;
  const s=(r.selectionStart!=null?r.selectionStart:r.value.length), e2=(r.selectionEnd!=null?r.selectionEnd:r.value.length);
  r.value=r.value.slice(0,s)+em+r.value.slice(e2);
  const pos=s+em.length; r.focus(); try{r.setSelectionRange(pos,pos);}catch(_){}
}
let FLOWS=null;
async function openFlows(id){
  const cm=document.getElementById('cannedmenu'); if(cm)cm.style.display='none';
  const em=document.getElementById('emojimenu'); if(em)em.style.display='none';
  const menu=document.getElementById('flowmenu'); if(!menu)return;
  if(menu.style.display==='block'){ menu.style.display='none'; return; }
  if(!FLOWS){ try{ const r=await (await fetch('/api/flows')).json(); FLOWS=(r.data&&r.data.flows)||[]; }catch(e){ FLOWS=[]; } }
  menu.innerHTML='<div class="flowhead">⚡ Fire an automation</div>'+
    (FLOWS.length?FLOWS.map((f,i)=>`<div class="flowitem" onclick="fireFlow('${id}',${i})">${esc(f.name)}</div>`).join('')
                 :'<div class="flowitem muted">No automations found</div>');
  menu.style.display='block';
}
async function fireFlow(id,i){
  const f=FLOWS&&FLOWS[i]; if(!f)return;
  if(!confirm('Fire "'+f.name+'" to this lead?\nThis sends the automation to them.'))return;
  const menu=document.getElementById('flowmenu'); if(menu)menu.style.display='none';
  const r=await (await fetch('/api/fire-flow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,flow_ns:f.ns,name:f.name})})).json();
  if(r&&r.blocked){ alert('Sending is OFF — automation NOT fired.'); return; }
  open_(id);
}
let CANNED=null;
async function loadCanned(force){ if(CANNED&&!force)return CANNED; try{ CANNED=await (await fetch('/api/canned')).json(); }catch(e){ CANNED=[]; } return CANNED; }
async function openCanned(id){
  const fm=document.getElementById('flowmenu'); if(fm)fm.style.display='none';
  const em=document.getElementById('emojimenu'); if(em)em.style.display='none';
  const menu=document.getElementById('cannedmenu'); if(!menu)return;
  if(menu.style.display==='block'){ menu.style.display='none'; return; }
  await loadCanned(true);
  menu.innerHTML='<div class="flowhead">⭐ Saved messages</div>'+
    (CANNED.length?CANNED.map(c=>`<div class="flowitem" onclick="useCanned(${c.id})"><span class="del" title="Delete" onclick="event.stopPropagation();delCanned(${c.id})">✕</span>${esc(c.title||c.text.slice(0,40))}</div>`).join('')
                  :'<div class="flowitem muted">No saved messages yet</div>')+
    '<div class="flowitem add" onclick="addCanned()">+ Add saved message</div>';
  menu.style.display='block';
}
function useCanned(id){
  const c=CANNED&&CANNED.find(x=>x.id===id); if(!c)return;
  const r=document.getElementById('reply'); if(r){ r.value=c.text; r.focus(); }
  const menu=document.getElementById('cannedmenu'); if(menu)menu.style.display='none';
}
function addCanned(){
  const menu=document.getElementById('cannedmenu'); if(menu)menu.style.display='none';
  document.getElementById('sm-text').value='';
  document.getElementById('sm-title').value='';
  document.getElementById('savedModal').classList.add('show');
  setTimeout(()=>document.getElementById('sm-text').focus(),30);
}
function closeSavedModal(){document.getElementById('savedModal').classList.remove('show');}
async function submitSavedModal(){
  const text=document.getElementById('sm-text').value;
  const title=document.getElementById('sm-title').value;
  if(!text||!text.trim()){document.getElementById('sm-text').focus();return;}
  await fetch('/api/canned',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.trim(),title:(title||'').trim()})});
  CANNED=null; closeSavedModal();
  if(CUR)openCanned(CUR); // reopen fresh list showing the new one
}
// close modal on overlay click or Escape
document.getElementById('savedModal').addEventListener('click',e=>{if(e.target.id==='savedModal')closeSavedModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSavedModal();closeBmModal();}
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&document.getElementById('savedModal').classList.contains('show'))submitSavedModal();
  if(e.key==='Enter'&&document.getElementById('bmModal').classList.contains('show')){e.preventDefault();submitBmModal();}
});
async function delCanned(id){
  if(!confirm('Delete this saved message?'))return;
  await fetch('/api/canned/'+id,{method:'DELETE'});
  const menu=document.getElementById('cannedmenu'); if(menu)menu.style.display='none';
  if(CUR)openCanned(CUR); // reopen fresh list
}
async function send(id,text){ if(!text||!text.trim())return;
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,text:text.trim()})});
  open_(id);
}
async function setMode(id,mode){
  await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,mode})});
  open_(id);
}
// ---- bookmarks panel (setter quick links) ----
function favHost(u){try{return new URL(u).hostname;}catch(e){return (u||'').replace(/^https?:\/\//,'').split('/')[0];}}
async function renderBookmarks(){
  const p=document.getElementById('panel'); if(!p)return;
  let bm=[]; try{ bm=await (await fetch('/api/bookmarks')).json(); }catch(e){}
  p.innerHTML='<h4 style="margin-top:0">🔖 Bookmarks</h4>'+
    (bm.length?bm.map(b=>`<a class="bm" href="${esc(b.url)}" target="_blank" rel="noopener">
        <img class="ico" src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(favHost(b.url))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ico',textContent:'🔗'}))"><span class="lbl">${esc(b.label)}</span>
        <span class="del" title="Remove" onclick="event.preventDefault();event.stopPropagation();delBookmark(${b.id})">✕</span>
      </a>`).join(''):'<div style="color:var(--muted);font-size:12px;margin-bottom:8px">No bookmarks yet</div>')+
    '<button class="bm-add" onclick="addBookmark()">+ Add bookmark</button>';
}
function addBookmark(){
  document.getElementById('bm-label').value='';
  document.getElementById('bm-url').value='';
  document.getElementById('bmModal').classList.add('show');
  setTimeout(()=>document.getElementById('bm-label').focus(),30);
}
function closeBmModal(){document.getElementById('bmModal').classList.remove('show');}
async function submitBmModal(){
  const label=document.getElementById('bm-label').value;
  const url=document.getElementById('bm-url').value;
  if(!label||!label.trim()){document.getElementById('bm-label').focus();return;}
  if(!url||!url.trim()){document.getElementById('bm-url').focus();return;}
  await fetch('/api/bookmarks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:label.trim(),url:url.trim()})});
  closeBmModal(); renderBookmarks();
}
document.getElementById('bmModal').addEventListener('click',e=>{if(e.target.id==='bmModal')closeBmModal();});
async function delBookmark(id){
  if(!confirm('Remove this bookmark?'))return;
  await fetch('/api/bookmarks/'+id,{method:'DELETE'});
  renderBookmarks();
}
// click anywhere outside an open menu (or its trigger button) closes all three menus
document.addEventListener('click',e=>{
  if(e.target.closest('.flowmenu')||e.target.closest('.emojimenu')||e.target.closest('.auto-btn')||e.target.closest('.canned-btn')||e.target.closest('.emoji-btn'))return;
  ['flowmenu','cannedmenu','emojimenu'].forEach(id=>{const m=document.getElementById(id);if(m)m.style.display='none';});
});
renderBookmarks();
loadList(); setInterval(()=>{loadList(); if(CUR)open_(CUR,true);},5000);
</script>
</body>
