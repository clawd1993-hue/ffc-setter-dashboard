<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Main Script Flow</title>
<style>
  :root{
    --bg:#F4F6F8; --line:#E3E8EF; --ink:#1C2B3A; --muted:#6B7A8D;
    --blue:#0A84FF; --arrow:#9AA7B8; --card:#fff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);}
  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 18px;z-index:20;}
  .topbar h1{font-size:15px;font-weight:700;margin:0;}
  .topbar .sub{font-size:12px;color:var(--muted);}
  .topbar .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;
    cursor:pointer;color:var(--ink);}
  .btn:hover{background:#F7F9FB;}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{filter:brightness(.95);}
  /* whiteboard */
  #board{position:absolute;top:52px;left:0;right:0;bottom:0;overflow:auto;
    background-color:var(--bg);
    background-image:radial-gradient(#D5DCE4 1.2px, transparent 1.2px);
    background-size:22px 22px;}
  #canvas{position:relative;width:5200px;height:11000px;}
  svg#wires{position:absolute;top:0;left:0;width:5200px;height:11000px;pointer-events:none;overflow:visible;}
  svg#wires path{pointer-events:stroke;cursor:pointer;}
  svg#wires .wirelabel{pointer-events:auto;cursor:pointer;}
  /* message bubble */
  .node{position:absolute;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 2px 6px rgba(20,40,70,.08);user-select:none;cursor:grab;}
  .node.drag{cursor:grabbing;box-shadow:0 8px 22px rgba(20,40,70,.18);z-index:5;}
  .node .head{display:flex;align-items:center;gap:7px;padding:9px 12px 7px;border-bottom:1px solid #EEF2F6;}
  .node .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:0 0 auto;}
  .node .title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .node .body{padding:11px 12px 13px;font-size:14px;line-height:1.4;color:var(--ink);}
  .stepflow{background:#EAF3FF;border:1px solid #BFDBFF;color:#1B63C4;border-radius:8px;padding:6px 9px;
    font-size:12px;font-weight:700;margin-bottom:7px;}
  .stepmsg{background:#F7F9FB;border:1px solid #EAEEF2;border-radius:8px;padding:7px 9px;font-size:13px;
    line-height:1.38;margin-bottom:7px;}
  .stepflow:last-child,.stepmsg:last-child{margin-bottom:0;}
  /* reviewed = logic checked & done */
  .node.reviewed{background:#E7F7EC;border-color:#A7E0BA;}
  .rev-toggle{position:absolute;top:7px;right:8px;width:18px;height:18px;border-radius:50%;border:1.5px solid #CBD5E0;
    background:#fff;color:#CBD5E0;font-size:11px;font-weight:800;line-height:15px;text-align:center;cursor:pointer;user-select:none;z-index:3;}
  .rev-toggle:hover{border-color:#2BB667;color:#2BB667;}
  .node.reviewed .rev-toggle{background:#2BB667;border-color:#2BB667;color:#fff;}
  /* route pill — a junction, not a message bubble */
  .node.route{width:230px;background:#EDF1F6;border:1px solid #CFD8E2;border-radius:24px;box-shadow:0 1px 3px rgba(20,40,70,.06);}
  .node.route .routelabel{padding:11px 18px;text-align:center;font-size:13px;font-weight:700;color:#5A6B7D;}
  /* connector handles */
  .port{position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--arrow);
    left:50%;transform:translateX(-50%);cursor:crosshair;transition:border-color .12s,background .12s;}
  .port:hover{border-color:var(--blue);background:var(--blue);}
  .port.in{top:-9px;}
  .port.out{bottom:-9px;}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1C2B3A;color:#fff;
    font-size:12px;padding:7px 14px;border-radius:20px;opacity:.9;z-index:20;}
  /* Hard Rules sticky note (pinned top-left, stays on screen) */
  #rules{position:fixed;top:62px;left:12px;width:270px;z-index:30;background:#FFF9E6;border:1px solid #EAD98C;
    border-radius:12px;box-shadow:0 6px 20px rgba(60,50,10,.14);font-size:12.5px;overflow:hidden;}
  #rules .rhead{display:flex;align-items:center;gap:7px;padding:9px 11px;background:#FBEFBF;border-bottom:1px solid #EAD98C;
    cursor:pointer;user-select:none;font-weight:800;color:#6B5A10;}
  #rules .rhead .rcount{margin-left:auto;font-weight:700;color:#9A861F;font-size:11px;}
  #rules.collapsed .rbody{display:none;}
  #rules .rbody{padding:7px 9px 10px;max-height:52vh;overflow:auto;}
  #rules ul{list-style:none;margin:0 0 7px;padding:0;}
  #rules li{display:flex;gap:7px;align-items:flex-start;padding:5px 4px;border-bottom:1px dashed #ECE0AE;line-height:1.35;color:#4A431F;}
  #rules li .bullet{color:#C9A227;font-weight:800;flex:0 0 auto;}
  #rules li .rtext{flex:1;white-space:pre-wrap;word-break:break-word;}
  #rules li .rdel{flex:0 0 auto;cursor:pointer;color:#B9A14A;font-weight:800;opacity:.6;}
  #rules li .rdel:hover{opacity:1;color:#C0392B;}
  #rules .radd{display:flex;gap:6px;}
  #rules textarea{flex:1;resize:vertical;min-height:34px;max-height:120px;border:1px solid #E2D084;border-radius:8px;
    padding:6px 8px;font:inherit;font-size:12px;background:#fff;color:#4A431F;}
  #rules .raddbtn{border:none;background:#D9B21E;color:#fff;font-weight:800;border-radius:8px;padding:0 12px;cursor:pointer;}
  #rules .raddbtn:hover{filter:brightness(.95);}
  #rules .rempty{color:#A2924A;padding:4px;font-style:italic;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>Main Script Flow</h1>
    <span class="sub">top → bottom · logic tree</span>
    <div class="spacer"></div>
    <button class="btn" onclick="setZoom(zoom-0.1)">−</button>
    <span id="zlabel" style="font-size:12px;color:var(--muted);min-width:40px;text-align:center;">100%</span>
    <button class="btn" onclick="setZoom(zoom+0.1)">+</button>
    <button class="btn" onclick="fitAll()">Fit</button>
    <button class="btn" onclick="resetView()">Reset view</button>
    <button class="btn" onclick="resetLayout()" title="Clear your saved drags, back to default layout">Reset layout</button>
    <button class="btn primary" onclick="addNode()">+ Add bubble</button>
  </div>

  <div id="rules">
    <div class="rhead" onclick="toggleRules()"><span>⚑ Hard Rules</span><span class="rcount" id="rcount"></span><span id="rchev">▾</span></div>
    <div class="rbody">
      <ul id="rlist"></ul>
      <div class="radd">
        <textarea id="rinput" placeholder="New hard rule…  (⌘/Ctrl+Enter)"></textarea>
        <button class="raddbtn" onclick="addRule()">+</button>
      </div>
    </div>
  </div>

  <div id="board">
    <div id="canvas">
      <svg id="wires">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#9AA7B8"/>
          </marker>
        </defs>
      </svg>
    </div>
  </div>
  <div class="hint">Drag bubbles to move (auto-saves) · DRAG a label to bend its arrow through it · click a label = jump · double-click a label (or the line) = edit/delete · ⌘/Ctrl-scroll or pinch to zoom · "Reset layout" clears your drags</div>

<script>
const canvas=document.getElementById('canvas');
const svg=document.getElementById('wires');
let nodes=[], edges=[], uid=1, zoom=1;
let hardRules=[];

// ⚑ Hard Rules sticky note — standing rules for the AI / flow, shared across setters
function renderRules(){
  const ul=document.getElementById('rlist'); if(!ul) return;
  document.getElementById('rcount').textContent = hardRules.length ? hardRules.length : '';
  if(!hardRules.length){ ul.innerHTML='<li class="rempty">No rules yet — add one below.</li>'; return; }
  ul.innerHTML = hardRules.map((r,i)=>
    `<li><span class="bullet">•</span><span class="rtext">${esc(r)}</span><span class="rdel" onclick="delRule(${i})" title="Delete">✕</span></li>`
  ).join('');
}
function addRule(){
  const t=document.getElementById('rinput'); const v=(t.value||'').trim();
  if(!v) return;
  hardRules.push(v); t.value='';
  renderRules(); savePositions();           // persists in the shared layout row
}
function delRule(i){
  hardRules.splice(i,1); renderRules(); savePositions();
}
function toggleRules(){
  const box=document.getElementById('rules'); box.classList.toggle('collapsed');
  document.getElementById('rchev').textContent = box.classList.contains('collapsed') ? '▸' : '▾';
}
document.addEventListener('DOMContentLoaded',()=>{
  renderRules();
  const t=document.getElementById('rinput');
  if(t) t.addEventListener('keydown',ev=>{ if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'){ ev.preventDefault(); addRule(); } });
});

// ---- zoom ----
function setZoom(z){
  zoom=Math.min(1.5,Math.max(0.45,Math.round(z*100)/100));
  canvas.style.transformOrigin='0 0';
  canvas.style.transform='scale('+zoom+')';
  const zl=document.getElementById('zlabel'); if(zl) zl.textContent=Math.round(zoom*100)+'%';
}
// ⌘/ctrl-scroll or trackpad pinch to zoom toward the cursor
document.getElementById('board').addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault();
  const board=document.getElementById('board'), r=board.getBoundingClientRect();
  const before=toCanvas(e.clientX,e.clientY);
  setZoom(zoom*(e.deltaY<0?1.1:0.9));
  const after=toCanvas(e.clientX,e.clientY);
  board.scrollLeft+=(before.x-after.x)*zoom;
  board.scrollTop +=(before.y-after.y)*zoom;
},{passive:false});
// zoom so the whole tree fits the viewport
function fitAll(){
  if(!nodes.length) return;
  const board=document.getElementById('board');
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  nodes.forEach(n=>{const h=nodeH(n.id);minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x+230);maxY=Math.max(maxY,n.y+h);});
  const pad=120, w=maxX-minX+pad*2, h=maxY-minY+pad*2;
  const z=Math.min(board.clientWidth/w, board.clientHeight/h, 1.2);
  setZoom(z);
  board.scrollTo({left:(minX-pad)*zoom, top:(minY-pad)*zoom, behavior:'smooth'});
}

// ---- seed: 3 dummy bubbles chained top → bottom ----

    {t:'msg',  text:'While you get to it, curious to know why now? What changed recently?'}]};

  // STEP 1 (A batch — fire VN then message — is ONE bubble). Two bridges, each with its OWN Step 2 cluster.
  nodes=[
    {id:'n1', x:1680, y:90, title:'STEP 1 · Opener', steps:[

      {t:'msg',  text:'Quick one before we dive in, have you tried building something online before, or is this your first real look into it?'},

      {t:'msg',  text:"Sure, no worries then you're exactly who this was built for. Most of our best students started from zero. Let me send you a quick voice note so you get how the whole thing works"},
      {t:'flow', name:'What is FFC'},
      {t:'msg',  text:'So have you had a chance to watch the first video of the training yet?'},
    ]},
    {id:'n3', x:2400, y:470, title:'Bridge · Tried before', steps:[
      {t:'msg',  text:'Ah nice, so you already know the game. That makes this easier, the part most people get stuck on is the offer, not the tech. Let me send you a quick voice note on how we do it differently'},
      {t:'flow', name:'What is FFC'},
      {t:'msg',  text:'So have you had a chance to watch the first video of the training yet?'},
    ]},
    // Beginner bridge → its own Step 2 trio
    {id:'b_w', x:680,  y:1000, ...WHY_WATCHED},
    {id:'b_n', x:1000, y:1000, ...WHY_NOT},
    {id:'b_l', x:1320, y:1000, ...WHY_LINK},

    {id:'t_n', x:2400, y:1000, ...WHY_NOT},
    {id:'t_l', x:2720, y:1000, ...WHY_LINK},
  ];
  // All six Step-2 bubbles end on the SAME "why now?" question → they converge into ONE hub,

    {id:'hub3', x:1540, y:1500, kind:'route', title:'They answer "why now?"'},
    {id:'s3_job', x:1325,  y:1840, title:'STEP 3 · Why now: job stress / hate 9–5', steps:[
      {t:'msg', text:"Yeah, trading hours for money gets old fast, makes sense you're looking. Have you tried anything before to get out of it, like a course or coaching, or is this your first real go?"}]},
    {id:'s3_money', x:1755, y:1840, title:'STEP 3 · Why now: money tight / debt', steps:[

    {id:'s3_fam', x:2185,  y:1840, title:'STEP 3 · Why now: family / freedom / time', steps:[
      {t:'msg', text:"Love that! so it's about buying your time back, not just the money. What's the setup right now? Working full-time, running something of your own, or in between?"}]},
    {id:'s3_mon', x:2615, y:1840, title:'STEP 3 · Why now: just money / 2nd income', steps:[
      {t:'msg', text:"Fair! And what would actually change for you if this worked? Not the money itself, what it's for?"}]},
    {id:'s3_burned', x:465, y:1840, title:'STEP 3 · Burned / scammed before', steps:[

    {id:'s3_tried', x:895, y:1840, title:'STEP 3 · Tried stuff before / nothing worked', steps:[
      {t:'msg', text:"So you've already put in effort and it didn't pay off, that's actually the exact person this works best for. What was missing last time - the info, or the support after you invested?"}]},

    // ===== STEP 3 → GATE · RIGHT sub-tree: SITUATION (Money/Family) → INVESTED → Gate =====
    {id:'rt_setupA', x:1780, y:2240, kind:'route', title:'They answer: work setup?'},
    {id:'sit_work',    x:1340, y:2580, title:'Setup · Working / job', steps:[
      {t:'msg', text:"Got it, so this would run alongside the job for now, that's how most people start 💪 And have you ever invested in a course or coaching before to learn this kind of thing?"}]},
    {id:'sit_own',     x:1780, y:2580, title:'Setup · Own business', steps:[
      {t:'msg', text:'Nice, so you already think like an owner. That\'s half the battle. And have you ever invested in a course or coaching before?'}]},
    {id:'sit_study',   x:2220, y:2580, title:'Setup · Studying', steps:[
      {t:'msg', text:"Cool! so time's probably on your side, budget maybe less so. And have you ever invested in a course or coaching before?"}]},
    {id:'sit_between', x:2660, y:2580, title:'Setup · In between / laid off', steps:[
      {t:'msg', text:'Got it. So this could actually be the thing you build into, not just on the side. And have you ever invested in a course or coaching before?'}]},
    {id:'rt_inv', x:1780, y:3000, kind:'route', title:'They answer: invested in a course/coaching before?'},
    {id:'inv_yes',   x:1860, y:3300, title:'Invested · Yes, it helped', steps:[
      {t:'msg', text:'Nice, so you already know investing in the right help speeds things up.'}]},
    {id:'inv_no',    x:2300, y:3300, title:'Invested · No / never', steps:[
      {t:'msg', text:'Okay, so this is the first time you\'re taking it seriously. (makes sense to be cautious then)'}]},
    {id:'inv_tried', x:2740, y:3300, title:'Invested · Tried but didn\'t follow through', steps:[
      {t:'msg', text:"So you've already put in effort and it didn't pay off, and it wasn't the info, it was doing it alone that got [their word]. That's actually the exact person this works best for."}]},

    // ===== STEP 3 → GATE · LEFT sub-tree: WHAT WAS MISSING → setup (acknowledge-only) → Gate =====
    {id:'rt_miss', x:700, y:2240, kind:'route', title:'They answer: the info, or the support?'},
    {id:'miss_support', x:480, y:2580, title:'What was missing · Support / doing it alone', steps:[

    {id:'rt_setupB', x:700, y:3000, kind:'route', title:'They answer: work setup? (invested already known → skip course Q)'},
    {id:'ack_work',    x:60,  y:3300, title:'Setup (ack-only) · Working / job', steps:[
      {t:'msg', text:"Got it, so this would run alongside the job for now, that's how most people start 💪"}]},
    {id:'ack_own',     x:500,  y:3300, title:'Setup (ack-only) · Own business', steps:[

    // ===== STEP 4 · THE GATE =====

    {id:'red_note', x:2860, y:4620, kind:'route', title:'→ cancel Calendly · tag UQ-red · check-in date 2–4 weeks out'},


    // ===== 2a · Price (has income) sub-branches =====

function currentLayout(){
  const pos={}; nodes.forEach(n=>{ pos[n.id]={x:n.x,y:n.y}; });
  const mids={}; edges.forEach(e=>{ if(e.mid) mids[e.from+'>'+e.to]={x:e.mid.x,y:e.mid.y}; });
  const reviewed=nodes.filter(n=>n.reviewed).map(n=>n.id);
  return {pos,mids,reviewed,rules:hardRules};
}
function savePositions(){
  const layout=currentLayout();
  try{ localStorage.setItem('flowPos', JSON.stringify(layout)); }catch(e){} // local cache for instant feel
  clearTimeout(saveTimer);                                                   // debounce the shared save
  saveTimer=setTimeout(()=>{ fetch('/api/flow-layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({layout})}).catch(()=>{}); }, 500);
}
function applyLayout(layout){
  if(!layout) return;
  const pos=layout.pos||layout, mids=layout.mids||{}; // backward-compat
  nodes.forEach(n=>{ if(pos[n.id]){ n.x=pos[n.id].x; n.y=pos[n.id].y; } });
  edges.forEach(e=>{ const k=e.from+'>'+e.to; if(mids[k]) e.mid=mids[k]; });
  const rev=layout.reviewed||[]; if(rev.length){ const set=new Set(rev); nodes.forEach(n=>{ n.reviewed=set.has(n.id); }); }
  if(Array.isArray(layout.rules)){ hardRules=layout.rules.slice(); renderRules(); }
}
function applySavedPositions(){ applyLayout(SAVED_LAYOUT); }
function resetLayout(){
  if(confirm('Reset all bubbles back to the default layout for EVERYONE? (clears the shared saved layout)')){
    localStorage.removeItem('flowPos');
    fetch('/api/flow-layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({layout:{pos:{},mids:{},rules:hardRules}})}).finally(()=>location.reload());
  }
}

function nodeById(id){return nodes.find(n=>n.id===id);}

function renderNodes(){
  // remove existing node divs (keep svg)
  [...canvas.querySelectorAll('.node')].forEach(e=>e.remove());
  nodes.forEach(n=>{
    const el=document.createElement('div');
    el.className='node'; el.dataset.id=n.id;
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
    const revBtn=`<div class="rev-toggle" title="Mark reviewed / done">✓</div>`;
    if(n.kind==='route'){
      el.className='node route';
      el.innerHTML=`
        ${revBtn}
        <div class="port in" data-port="in"></div>
        <div class="routelabel">${esc(n.title)}</div>
        <div class="port out" data-port="out"></div>`;
    } else {
      const steps=n.steps||[{t:'msg',text:n.text||''}];
      const body=steps.map(s=> s.t==='flow'
        ? `<div class="stepflow">⚡ ${esc(s.name)}</div>`
        : `<div class="stepmsg">${esc(s.text)}</div>`).join('');
      el.innerHTML=`
        ${revBtn}
        <div class="port in" data-port="in"></div>
        <div class="head"><span class="dot"></span><span class="title">${esc(n.title)}</span></div>
        <div class="body">${body}</div>
        <div class="port out" data-port="out"></div>`;
    }
    if(n.reviewed) el.classList.add('reviewed');
    canvas.appendChild(el);
  });
  try{ wireInteractions(); }catch(err){ console.error('wireInteractions failed:', err); } // never let this block drawWires
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ---- wires (SVG paths) ----
function centerOut(n){return {x:n.x+115, y:n.y+nodeH(n.id)};}
function centerIn(n){return {x:n.x+115, y:n.y};}
function nodeH(id){const el=canvas.querySelector(`.node[data-id="${id}"]`);return el?el.offsetHeight:90;}
function pathD(a,b){
  const dy=Math.max(40,Math.abs(b.y-a.y)/2);
  return `M ${a.x} ${a.y} C ${a.x} ${a.y+dy}, ${b.x} ${b.y-dy}, ${b.x} ${b.y}`;
}
function drawWires(){
  [...svg.querySelectorAll('.wire,.wirelabel')].forEach(e=>e.remove());
  edges.forEach((e,i)=>{
    const a=nodeById(e.from), b=nodeById(e.to); if(!a||!b)return;
    let A,B,lx,ly;
    if(e.loop){
      const hA=nodeH(a.id), hB=nodeH(b.id), bow=300;
      A={x:a.x+230, y:a.y+hA/2}; B={x:b.x+230, y:b.y+hB/2};
      lx=(A.x+B.x)/2 + 0.75*bow; ly=(A.y+B.y)/2;
    } else { A=centerOut(a); B=centerIn(b); lx=(A.x+B.x)/2; ly=(A.y+B.y)/2; }
    // if you've dragged the label, bend the curve THROUGH that point; else default shape
    let dStr;
    if(e.mid){
      const cx=2*e.mid.x-(A.x+B.x)/2, cy=2*e.mid.y-(A.y+B.y)/2; // control so bezier passes through mid at t=.5
      dStr=`M ${A.x} ${A.y} Q ${cx} ${cy} ${B.x} ${B.y}`;
      lx=e.mid.x; ly=e.mid.y;
    } else if(e.loop){
      const bow=300; dStr=`M ${A.x} ${A.y} C ${A.x+bow} ${A.y}, ${B.x+bow} ${B.y}, ${B.x} ${B.y}`;
    } else { dStr=pathD(A,B); }
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','wire');
    p.setAttribute('d',dStr);
    p.setAttribute('fill','none'); p.setAttribute('stroke','#9AA7B8'); p.setAttribute('stroke-width','2');
    p.setAttribute('marker-end','url(#arrow)');
    p.addEventListener('click',()=>editEdge(i));
    svg.appendChild(p);
    if(e.label){
      const mx=lx, my=ly;
      const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','wirelabel');
      const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      const w=e.label.length*7.5+16;
      rect.setAttribute('x',mx-w/2);rect.setAttribute('y',my-11);rect.setAttribute('width',w);rect.setAttribute('height',22);
      rect.setAttribute('rx',11);rect.setAttribute('fill','#fff');rect.setAttribute('stroke','#D5DCE4');
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',mx);t.setAttribute('y',my+4);t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','12');t.setAttribute('font-weight','600');t.setAttribute('fill','#3A4A5C');
      t.textContent=e.label;
      g.appendChild(rect);g.appendChild(t);
      g.style.cursor='grab';
      // drag the label → bends the arrow through it; a plain click (no drag) = jump; dbl-click = edit
      g.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); labelDrag={i, sx:ev.clientX, sy:ev.clientY, moved:false}; });
      g.addEventListener('dblclick',ev=>{ ev.stopPropagation(); editEdge(i); });
      svg.appendChild(g);
    }
  });
}
// smooth-scroll the board so a node is centered in view (at the current zoom)
function scrollToNode(id){
  const n=nodeById(id); if(!n)return;
  const board=document.getElementById('board'), h=nodeH(id);
  board.scrollTo({
    left:(n.x+115)*zoom-board.clientWidth/2,
    top:(n.y+h/2)*zoom-board.clientHeight/2,
    behavior:'smooth'
  });
}
// click a bubble / label → zoom to a focused level AND glide it into the center.
// zoom + scroll are animated TOGETHER each frame (node stays centered throughout = no jump).
const FOCUS_ZOOM=1;
let focusAnim=null;
function focusNode(id){
  const n=nodeById(id); if(!n)return;
  const board=document.getElementById('board'), h=nodeH(id);
  const cx=n.x+115, cy=n.y+h/2;          // node centre in canvas space (zoom-independent)
  const z0=zoom, z1=FOCUS_ZOOM;
  const s0x=board.scrollLeft, s0y=board.scrollTop;          // where we are now
  const s1x=cx*z1-board.clientWidth/2, s1y=cy*z1-board.clientHeight/2; // where we want to end up
  const dur=420, t0=performance.now();
  canvas.style.transition='';             // we drive scale manually
  if(focusAnim) cancelAnimationFrame(focusAnim);
  (function step(now){
    const p=Math.min(1,(now-t0)/dur);
    const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2; // easeInOut
    zoom=z0+(z1-z0)*e;
    canvas.style.transform='scale('+zoom+')';
    const zl=document.getElementById('zlabel'); if(zl) zl.textContent=Math.round(zoom*100)+'%';
    board.scrollLeft=s0x+(s1x-s0x)*e;      // glide the scroll in step with the zoom
    board.scrollTop =s0y+(s1y-s0y)*e;
    if(p<1) focusAnim=requestAnimationFrame(step); else focusAnim=null;
  })(t0);
}
function editEdge(i){
  const e=edges[i]; if(!e)return;
  const v=prompt('Branch label (e.g. Yes / No / Green).\nType "x" to delete this arrow.', e.label||'');
  if(v===null)return;
  if(v.trim().toLowerCase()==='x'){edges.splice(i,1);} else {e.label=v.trim();}
  drawWires();
}

// ---- interactions: drag nodes + draw connections ----
let drag=null, link=null, tempPath=null, labelDrag=null;
function wireInteractions(){
  canvas.querySelectorAll('.node').forEach(el=>{
    const id=el.dataset.id;
    const rev=el.querySelector('.rev-toggle');
    if(rev){
      rev.addEventListener('pointerdown',ev=>ev.stopPropagation()); // don't start a drag
      rev.addEventListener('click',ev=>{
        ev.stopPropagation();
        const n=nodeById(id); if(!n) return;
        n.reviewed=!n.reviewed;
        el.classList.toggle('reviewed', n.reviewed);
        savePositions(); // persists reviewed[] in the shared layout
      });
    }
    el.addEventListener('pointerdown',ev=>{
      if(ev.target.classList.contains('port')) return; // handled below
      if(ev.target.classList.contains('rev-toggle')) return; // review toggle, not a drag
      const n=nodeById(id); const p=toCanvas(ev.clientX,ev.clientY);
      drag={id,dx:p.x-n.x,dy:p.y-n.y,el,sx:ev.clientX,sy:ev.clientY};
      el.classList.add('drag'); el.setPointerCapture(ev.pointerId);
    });
    const outPort=el.querySelector('.port.out'); if(!outPort) return;
    outPort.addEventListener('pointerdown',ev=>{
      ev.stopPropagation();
      link={from:id};
      tempPath=document.createElementNS('http://www.w3.org/2000/svg','path');
      tempPath.setAttribute('fill','none');tempPath.setAttribute('stroke','#0A84FF');
      tempPath.setAttribute('stroke-width','2');tempPath.setAttribute('stroke-dasharray','5 4');
      tempPath.setAttribute('marker-end','url(#arrow)');
      svg.appendChild(tempPath);
      canvas.setPointerCapture(ev.pointerId);
    });
  });
}

document.addEventListener('pointermove',ev=>{
  if(drag){
    const n=nodeById(drag.id); const p=toCanvas(ev.clientX,ev.clientY);
    n.x=p.x-drag.dx; n.y=p.y-drag.dy;
    drag.el.style.left=n.x+'px'; drag.el.style.top=n.y+'px';
    drawWires();
  } else if(labelDrag){
    const p=toCanvas(ev.clientX,ev.clientY);
    edges[labelDrag.i].mid={x:p.x, y:p.y};              // drag label = bend the arrow through it
    if(Math.hypot(ev.clientX-labelDrag.sx, ev.clientY-labelDrag.sy)>4) labelDrag.moved=true;
    drawWires();
  } else if(link){
    const a=centerOut(nodeById(link.from));
    const pt=toCanvas(ev.clientX,ev.clientY);
    tempPath.setAttribute('d',pathD(a,pt));
  }
});
document.addEventListener('pointerup',ev=>{
  if(labelDrag){
    if(labelDrag.moved) savePositions();               // persist the new arc
    else focusNode(edges[labelDrag.i].to);             // plain click on label = jump to that bubble
    labelDrag=null;
  }
  if(drag){
    drag.el.classList.remove('drag');
    const moved=Math.hypot(ev.clientX-drag.sx, ev.clientY-drag.sy)>5;
    const id=drag.id; drag=null;
    if(!moved) focusNode(id); // a plain click (no drag) → zoom+center this bubble
    else savePositions();     // a real drag → auto-save the layout
  }
  if(link){
    const over=document.elementFromPoint(ev.clientX,ev.clientY);
    const tgt=over&&over.closest('.node');
    if(tgt&&tgt.dataset.id!==link.from){
      // dropped on an existing bubble → connect to it
      const to=tgt.dataset.id;
      if(!edges.some(e=>e.from===link.from&&e.to===to)) edges.push({from:link.from,to});
    } else if(!tgt){
      // dropped on empty canvas → SPAWN a new branch bubble here and connect
      const pt=toCanvas(ev.clientX,ev.clientY);
      const id='n'+(uid++);
      nodes.push({id, x:pt.x-115, y:pt.y-10, title:'New bubble', steps:[{t:'msg',text:'New message bubble.'}]});
      edges.push({from:link.from,to:id});
      renderNodes();
    }
    if(tempPath){tempPath.remove();tempPath=null;}
    link=null; drawWires();
  }
});
// translate a viewport point into canvas coordinates (account for scroll)
function toCanvas(cx,cy){
  const board=document.getElementById('board'), r=board.getBoundingClientRect();
  return {x:(cx-r.left+board.scrollLeft)/zoom, y:(cy-r.top+board.scrollTop)/zoom};
}

function addNode(){
  const id='n'+(uid++);
  const board=document.getElementById('board');
  nodes.push({id, x:board.scrollLeft+500, y:board.scrollTop+160, title:'New bubble', steps:[{t:'msg',text:'New message bubble.'}]});
  renderNodes(); drawWires();
}
function resetView(){
  const board=document.getElementById('board');
  // center the top node horizontally
  const left=1795-board.clientWidth/2;
  board.scrollTo({left:Math.max(0,left),top:0,behavior:'smooth'});
}

function boot(){
  try { seed(); } catch(err){ document.querySelector('.topbar .sub').textContent='INIT ERROR: '+err.message; console.error(err); }
  resetView();
}
// load the SHARED layout from the backend first (so every setter sees the same arrangement),
// fall back to this browser's local cache if the request fails.
fetch('/api/flow-layout').then(r=>r.json()).then(d=>{ SAVED_LAYOUT=d&&d.layout||null; })
  .catch(()=>{ try{ SAVED_LAYOUT=JSON.parse(localStorage.getItem('flowPos')||'null'); }catch(e){} })
  .finally(boot);
</script>
</body>
</html>
